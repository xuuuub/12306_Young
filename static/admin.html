<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>火车票系统 - 管理员后台</title>
    <link rel="stylesheet" href="/static/css/admin.css">

</head>
<body>
    <div class="container">
        <header>
            <h1>🚄 火车票管理系统 - 管理员后台</h1>

        <div class="nav-buttons">
            <a href="admin_orders.html" class="nav-btn">📋 查看所有订单</a>

            <div class="table-body-wrapper">

                    <thead>

                            <th>用户名</th>
                            <th>角色</th>

                    </thead>
                    <tbody id="userList">
                        <tr><td colspan="4">点击“刷新用户列表”加载数据</td></tr>
                    </tbody>
                    
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js" defer></script>
